<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Grid – Bright IoT Edition</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f172a;
      --border:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --focus:#ffffff;
    }
    body{
      margin:0;
      font-family: system-ui, Segoe UI, Tahoma, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:1024px; margin:0 auto; padding:22px;}
    .panel{
      background:rgba(255,255,255,0.03);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    h1{font-size:20px; margin:0 0 8px; font-weight:900;}
    .sub{margin:0 0 14px; color:var(--muted); line-height:1.5}

    .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
    button{
      cursor:pointer; border:0;
      border-radius:12px;
      padding:10px 14px;
      font-weight:900;
      background:#22c55e;
      color:#052e16;
    }
    button:disabled{opacity:.55; cursor:not-allowed;}
    .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.03);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(6, 1fr);
      gap:0; /* ให้ติดกันเหมือนภาพ */
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--border);
    }
    .cell{
      min-height:122px;
      padding:12px 12px 10px;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .cell .name{
      font-weight:900;
      font-size:15px;
      line-height:1.2;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }
    .cell .vals{
      font-weight:900;
      font-size:18px;
      line-height:1.05;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }
    .cell .vals div{margin-top:2px;}
    .cell .pct{
      position:absolute;
      left:12px;
      bottom:8px;
      font-weight:900;
      font-size:13px;
      opacity:.95;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }

    /* Focus animation */
    .cell.focus{
      outline:4px solid rgba(255,255,255,.95);
      outline-offset:-4px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.25);
      filter: brightness(1.06) saturate(1.08);
      transform: translateZ(0);
      z-index: 2;
    }
    .cell.focus::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.22), rgba(255,255,255,0) 55%);
      pointer-events:none;
    }

    /* Result box */
    .result{
      margin-top:14px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:12px;
    }
    .box{
      border:1px solid var(--border);
      background:rgba(255,255,255,0.03);
      border-radius:14px;
      padding:14px;
    }
    .big{font-weight:1000; font-size:18px; margin:0 0 6px;}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; color:var(--muted); line-height:1.6}
    .swatch{
      border:1px solid var(--border);
      border-radius:14px;
      min-height:120px;
    }

    /* Responsive */
    @media (max-width: 860px){
      .grid{grid-template-columns: repeat(3, 1fr);}
      .result{grid-template-columns: 1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>🎲 สุ่มโฟกัสสี — Bright Edition 💡</h1>
      <p class="sub">กด “เริ่มสุ่ม” แล้วจะไฮไลต์ทีละช่องเหมือนเกม จากนั้นสรุปว่าหยุดที่ช่องไหน</p>

      <div class="controls">
        <button id="startBtn">เริ่มสุ่ม</button>
        <span class="pill" id="status">พร้อม</span>
        <span class="pill">Delay: 1s</span>
        <span class="pill">Duration: 5s</span>
      </div>

      <div class="grid" id="grid"></div>

      <div class="result">
        <div class="box">
          <div class="big">ผลลัพธ์</div>
          <div id="resultText" class="mono">ยังไม่ได้เริ่มสุ่ม</div>
        </div>
        <div class="swatch" id="resultSwatch"></div>
      </div>
    </div>
  </div>

  <script>
    // ข้อมูลสีตามภาพ (ชื่อ + RGB + (optional) %)
    // หมายเหตุ: สีพื้นหลังใช้ HEX ที่คำนวณจาก RGB ให้แล้ว
    const data = [
      // แถว 1 — Bright IoT Edition
      {name:"Warm Brown",  rgb:[200,110, 70],  pct:null},
      {name:"Peach",       rgb:[255,195,160],  pct:null},
      {name:"Sky Blue",    rgb:[ 80,160,255],  pct:null},
      {name:"Leaf Green",  rgb:[ 60,200, 50],  pct:null},
      {name:"Soft Violet", rgb:[170,140,255],  pct:null},
      {name:"Teal",        rgb:[  0,230,200],  pct:null},

      // แถว 2
      {name:"Orange",      rgb:[255,130,  0],  pct:null},
      {name:"Indigo",      rgb:[ 60, 70,240],  pct:null},
      {name:"Vivid Red",   rgb:[240, 30, 50],  pct:null},
      {name:"Purple",      rgb:[180, 40,220],  pct:null},
      {name:"Lime",        rgb:[160,240,  0],  pct:null},
      {name:"Amber",       rgb:[255,185,  0],  pct:null},

      // แถว 3
      {name:"Blue",        rgb:[  0, 80,255],  pct:null},
      {name:"Green",       rgb:[  0,210, 50],  pct:null},
      {name:"Red",         rgb:[230, 20, 20],  pct:null},
      {name:"Yellow",      rgb:[255,225,  0],  pct:null},
      {name:"Magenta",     rgb:[250, 30,180],  pct:null},
      {name:"Cyan",        rgb:[  0,220,255],  pct:null},

      // แถว 4 — Pastel Light (แทน Neutral/Gray)
      {name:"Lavender",    rgb:[210,180,255],  pct:null},
      {name:"Mint",        rgb:[140,255,210],  pct:null},
      {name:"Baby Blue",   rgb:[140,210,255],  pct:null},
      {name:"Apricot",     rgb:[255,190,140],  pct:null},
      {name:"Lemon",       rgb:[255,250,120],  pct:null},
      {name:"Rose",        rgb:[255,140,180],  pct:null},
    ];

    const grid = document.getElementById('grid');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const resultText = document.getElementById('resultText');
    const resultSwatch = document.getElementById('resultSwatch');

    function rgbToHex([r,g,b]){
      const toHex = (n)=> n.toString(16).padStart(2,'0');
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function isDark([r,g,b]){
      // luminance approx
      const l = (0.2126*r + 0.7152*g + 0.0722*b);
      return l < 140;
    }

    // สร้างช่องตาราง
    const cells = data.map((d, idx)=>{
      const hex = rgbToHex(d.rgb);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.background = hex;
      cell.style.color = isDark(d.rgb) ? '#ffffff' : '#111827';

      cell.innerHTML = `
        <div>
          <div class="name">${d.name}</div>
        </div>
        <div class="vals">
          <div>${d.rgb[0]}</div>
          <div>${d.rgb[1]}</div>
          <div>${d.rgb[2]}</div>
        </div>
        `<div class="pct">${rgbToHex(d.rgb).toUpperCase()}</div>`
      `;
      cell.dataset.index = idx;
      cell.dataset.hex = hex;
      grid.appendChild(cell);
      return cell;
    });

    // ---- เกมสุ่มโฟกัส ----
    let timer = null;
    let tick = 0;
    let currentIndex = -1;
    let running = false;

    const DELAY_MS = 1000;      // หน่วง 1 วินาที
    const TOTAL_SECONDS = 10;    // รวม 5 วินาที
    const TOTAL_TICKS = TOTAL_SECONDS; // 1 tick = 1s

    function clearFocus(){
      cells.forEach(c=>c.classList.remove('focus'));
    }

    function pickNextIndex(){
      // สุ่มแบบไม่ให้ซ้ำติดกัน
      let next = Math.floor(Math.random() * cells.length);
      if (cells.length > 1){
        while(next === currentIndex) next = Math.floor(Math.random() * cells.length);
      }
      return next;
    }

    function setFocus(index){
      clearFocus();
      cells[index].classList.add('focus');
      currentIndex = index;
    }

    function showResult(index){
      const d = data[index];
      const hex = rgbToHex(d.rgb);
      resultSwatch.style.background = hex;

      resultText.innerHTML =
        `สี: <b style="color:#f9fafb;font-size:16px">${d.name}</b><br>` +
        `R = <b style="color:#f87171">${d.rgb[0]}</b> &nbsp; ` +
        `G = <b style="color:#4ade80">${d.rgb[1]}</b> &nbsp; ` +
        `B = <b style="color:#60a5fa">${d.rgb[2]}</b><br>` +
        `HEX: <b style="color:#34d399">${hex.toUpperCase()}</b><br><br>` +
        `<span style="color:#fbbf24">💡 ตั้งหลอดไฟ: R=${d.rgb[0]}, G=${d.rgb[1]}, B=${d.rgb[2]}</span>`;
    }

    function start(){
      if (running) return;
      running = true;
      tick = 0;
      statusEl.textContent = 'กำลังสุ่ม...';
      startBtn.disabled = true;
      resultText.textContent = 'กำลังสุ่ม...';

      // เริ่มสุ่มทันที 1 ครั้งก่อน แล้วค่อย interval
      setFocus(pickNextIndex());
      tick++;

      timer = setInterval(()=>{
        if (tick >= TOTAL_TICKS){
          stop();
          return;
        }
        setFocus(pickNextIndex());
        tick++;
      }, DELAY_MS);
    }

    function stop(){
      if (timer) clearInterval(timer);
      timer = null;
      running = false;
      startBtn.disabled = false;
      statusEl.textContent = 'เสร็จแล้ว ✅';
      showResult(currentIndex);
    }

    startBtn.addEventListener('click', start);

    // ตั้งค่าสีผลลัพธ์เริ่มต้น
    resultSwatch.style.background = '#334155';
  </script>
</body>
</html>
